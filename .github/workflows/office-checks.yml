name: Agent office checks
on:
  pull_request:
    paths: ['web/**', '.github/workflows/office-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:office
      - run: npm run build
      - run: npm run build:ui
      - run: npm run test:e2e:office
      - run: npm run test:e2e:office -- --grep 'production:'
        env:
          OFFICE_PRODUCTION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: office-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/

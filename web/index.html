    <script>
      // GitHub Pages caches index.html for 10 min and each deploy deletes the old hashed bundles.
      // If a bundle fails to load, reload once with a cache-busting query to fetch fresh HTML.
      (function () {
        if (/[?&]v=/.test(location.search)) {
          var c = new URL(location.href); c.searchParams.delete("v"); history.replaceState(null, "", c.href);
        }
        addEventListener("error", function (e) {
          var t = e.target;
          if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          // Lazy imports have local error boundaries and retry controls. A failed
          // preload must not reload the page before those controls can appear.
          if (t.tagName === "LINK" && t.rel === "modulepreload") return;
          var k = "asset-reload", n = Date.now();
          if (n - Number(sessionStorage.getItem(k) || 0) < 30000) return;
          sessionStorage.setItem(k, String(n));
          var u = new URL(location.href); u.searchParams.set("v", String(n)); location.replace(u.href);
        }, true);
      })();
    </script>
